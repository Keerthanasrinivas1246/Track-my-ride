{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete - Track My Ride{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7 text-center" data-aos="fade-up">
      <div class="card card-tmr border-0 shadow-lg p-5">
        <div class="stat-icon bg-success-subtle text-success mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem;">
          <i class="fas fa-check-circle"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Password Successfully Reset!</h3>
        <p class="text-muted small mb-4">
          Your new password has been saved. You may now log in to Track My Ride with your updated credentials.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary px-4 shadow">
          <i class="fas fa-sign-in-alt me-1"></i> Log In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
